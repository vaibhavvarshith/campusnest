version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campusnest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campusnest_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/02_sample-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - campusnest-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusnest-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campusnest_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: campusnest_super_secret_jwt_signing_key_2026_at_least_256_bits_long!
      SERVER_PORT: 8080
      TZ: Asia/Kolkata
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - campusnest-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusnest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - campusnest-net

networks:
  campusnest-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
